name: Test aplikacji na żywo
on:
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/test-api.yml', 'odkrywaj/**']
  workflow_dispatch:
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm i --no-save playwright-core@1 @mapbox/vector-tile@2 pbf@4 >/dev/null 2>&1
      - run: node tools/ph.mjs
      - run: (python3 -m http.server 8080 >/dev/null 2>&1 &) && sleep 1 && node tools/e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zrzuty
          path: '*.png'
